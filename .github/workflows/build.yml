name: Build APK

on:
  push:
    branches: [ project-septuary-android, main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: project-septuary-android
            artifact_name: project-septuary
            display_name: "Project Septuary"
          - dir: project-septuary-supervisor
            artifact_name: project-septuary-supervisor
            display_name: "Project Septuary Supervisor"
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses (SDK is preinstalled on ubuntu-latest runners)
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || yes | sdkmanager --licenses > /dev/null

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Stable signing key from repository secrets, so every build installs over the previous
      # one without uninstalling. The key never appears in the (public) repository.
      - name: Restore signing key
        env:
          KEYSTORE_B64: ${{ secrets.SEPTUARY_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SEPTUARY_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/septuary.jks"
            echo "SEPTUARY_KEYSTORE_PATH=$RUNNER_TEMP/septuary.jks" >> "$GITHUB_ENV"
            echo "SEPTUARY_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "Stable signing key loaded."
          else
            echo "::warning::SEPTUARY_KEYSTORE_B64 / SEPTUARY_KEYSTORE_PASSWORD secrets not set - this build is signed with a throwaway key and will NOT install over a previous build."
          fi
        shell: bash

      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee build_output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "----- Extracted error lines -----"
            grep -n -A 20 -E "error:|FAILURE:|^e: |Exception|Caused by:|issues were found|requires libraries and applications" build_output.log | head -200 | tee build_errors.txt
            # Emit as workflow error annotations so they're retrievable via the Checks API
            # (the full raw log is stored on a blob host that's unreachable from the diagnosing
            # session in this case; annotations go through the regular GitHub API instead).
            while IFS= read -r line; do
              safe=$(printf '%s' "$line" | sed 's/%/%25/g; s/\r/%0D/g; s/\n/%0A/g')
              echo "::error::${safe}"
            done < build_errors.txt
            exit 1
          fi
        shell: bash

      - name: Verify signing certificate
        run: |
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify --print-certs app/build/outputs/apk/debug/app-debug.apk | grep -E "certificate DN|SHA-256" | head -2
        shell: bash

      - name: Rename APK with run number
        run: cp app/build/outputs/apk/debug/app-debug.apk ${{ matrix.artifact_name }}-build-${{ github.run_number }}.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.dir }}/${{ matrix.artifact_name }}-build-${{ github.run_number }}.apk

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all APK artifacts
        uses: actions/download-artifact@v4
        with:
          path: apks
          merge-multiple: true

      - name: Create GitHub Release with both APKs attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Project Septuary — build ${{ github.run_number }}
          body: |
            Automated debug build of both apps. Download the matching .apk below and
            install directly on your phone (allow "install from unknown sources").

            - `project-septuary-build-*.apk` — the patient-facing tracker app
            - `project-septuary-supervisor-build-*.apk` — the read-only status app for parents
          files: apks/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
