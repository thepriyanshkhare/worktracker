name: Build APK

on:
  push:
    branches: [ project-septuary-android, main, master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project-septuary-android
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK with run number
        run: cp app/build/outputs/apk/debug/app-debug.apk project-septuary-build-${{ github.run_number }}.apk

      - name: Create GitHub Release with APK attached
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Project Septuary — build ${{ github.run_number }}
          body: "Automated debug build. Download the .apk below and install directly on your phone."
          files: project-septuary-android/project-septuary-build-${{ github.run_number }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
